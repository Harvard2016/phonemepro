name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsndfile1
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t phonemepro-api .
          docker build -t phonemepro-web web
      - name: Smoke test the API container
        run: |
          docker run -d --name api -p 8000:8000 phonemepro-api
          # No weights are mounted, so the container downloads the public fallback model first.
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health; then exit 0; fi
            sleep 5
          done
          docker logs api
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
